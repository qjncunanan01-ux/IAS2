<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — IAS2 Commerce</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .nf-shell { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; }
      .nf-code { font-size: clamp(4rem, 12vw, 7rem); font-weight: 800; line-height: 1;
        background: linear-gradient(135deg, #14b8a6, #8b5cf6); -webkit-background-clip: text;
        background-clip: text; color: transparent; }
      .nf-title { font-size: 1.4rem; font-weight: 700; margin: 12px 0 6px; }
      .nf-copy { color: var(--muted, #737373); margin: 0 0 20px; }
    </style>
  </head>
  <body>
    <div class="nf-shell">
      <div>
        <div class="nf-code">404</div>
        <div class="nf-title">This page wandered off</div>
        <p class="nf-copy">The page you're looking for doesn't exist — but the store is one click away.</p>
        <a class="primary-button" href="/">Back to the store</a>
      </div>
    </div>
  </body>
</html>

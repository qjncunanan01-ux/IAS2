<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IAS2 Commerce</title>
    <!-- Locks down everything to same-origin: no inline script, no inline
         styles, no remote code. The mirror-image HTTP headers live in .htaccess.
         connect-src also allows *.supabase.co (HTTPS + realtime WebSocket) for
         the optional Supabase backend — data only, no third-party code can run
         (script-src stays 'self', which is why the client is vendored below). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <!-- Supabase scaffold (optional): fill these in when the project exists and
         the app switches to the hosted backend — leave empty to stay on
         localStorage, the client then never initialises (js/modules/db.js is
         fail-closed). The anon key is PUBLIC by design: row access is enforced
         by the RLS policies in supabase/schema.sql, not by hiding the key. -->
    <meta name="supabase-url" content="" />
    <meta name="supabase-anon-key" content="" />
    <link rel="stylesheet" href="styles.css?v=29038539" />
    <link rel="icon" href="assets/placeholder.svg?v=cd1b9ef6" type="image/svg+xml" />
    <meta name="description" content="IAS2 Commerce — a demo store with a customer shop, cart, wishlist, checkout, and a full admin dashboard." />
    <meta name="theme-color" content="#14b8a6" />
    <script defer src="assets/vendor/lucide.min.js?v=2b531c43"></script>
    <!-- supabase-js vendored (not a CDN) so script-src 'self' keeps holding.
         UMD build sets window.supabase; js/modules/db.js only reads it lazily. -->
    <script defer src="assets/vendor/supabase.min.js?v=20afa08c"></script>
    <script type="module" src="js/modules/lightbox.js?v=990c66ab"></script>
    <script type="module" src="js/main.js?v=167332fc"></script>
  </head>
  <body>
    <a class="skip-link" href="#viewRoot">Skip to products</a>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" data-action="go-shop" aria-label="IAS2 Commerce home">
          <span class="brand-mark">IA</span>
          <span class="brand-copy">
            <strong>IAS2 Commerce</strong>
            <small>Store and admin</small>
          </span>
        </a>

        <nav class="nav-actions" aria-label="Main navigation">
          <button class="nav-button is-active" type="button" data-view="shop">
            <i data-lucide="store"></i>
            <span>Shop</span>
          </button>
          <button class="nav-button" type="button" data-view="orders">
            <i data-lucide="package-check"></i>
            <span>Orders</span>
          </button>
          <button class="nav-button" type="button" data-view="wishlist">
            <i data-lucide="heart"></i>
            <span>Wishlist</span>
          </button>
          <button class="nav-button is-admin hidden" type="button" data-view="admin">
            <i data-lucide="layout-dashboard"></i>
            <span>Admin</span>
          </button>
          <button class="nav-button cart-button" type="button" data-action="open-cart">
            <i data-lucide="shopping-cart"></i>
            <span>Cart</span>
            <strong id="cartCount">0</strong>
          </button>
          <button class="nav-button is-admin hidden icon-button" type="button" data-action="open-data-tools" aria-label="Data tools">
            <i data-lucide="database"></i>
          </button>
          <button class="nav-button icon-button" type="button" data-action="toggle-theme" aria-label="Toggle dark mode" id="themeToggle">
            <i data-lucide="sun"></i>
          </button>
        </nav>

        <div class="topbar-account" id="topbarAccount">
          <!-- Mobile account menu: on narrow screens a signed-in user gets one
               trigger here (their initials in a round chip — ui.js swaps it in
               via .has-initials, the generic icon is the fallback), and the
               badge + Login/Logout move into the panel it opens. Wide screens
               keep both children inline (.account-menu is display:contents),
               so nothing changes there. -->
          <button class="icon-button account-menu-toggle" type="button" id="accountMenuToggle"
                  data-action="toggle-account-menu" aria-controls="accountMenu"
                  aria-haspopup="true" aria-expanded="false" aria-label="Account menu">
            <i data-lucide="circle-user-round"></i>
            <!-- aria-hidden: the button's aria-label ("Account menu — <name>")
                 is and stays the accessible name; this is decoration. -->
            <span class="account-menu-initials" id="accountMenuInitials" aria-hidden="true"></span>
          </button>
          <div class="account-menu" id="accountMenu" role="group" aria-label="Account menu">
            <span class="user-badge hidden" id="userBadge"></span>
            <button class="primary-button" type="button" id="authButton" data-action="open-auth" data-mode="login">
              Login
            </button>
          </div>
        </div>
      </header>

      <main class="content-shell">
        <section class="store-toolbar" id="storeToolbar">
          <div class="field search-field">
            <label for="searchInput">Search</label>
            <div class="field-control with-icon">
              <i data-lucide="search"></i>
              <input id="searchInput" type="search" placeholder="Search items" autocomplete="off" />
              <button class="search-clear hidden" type="button" data-action="clear-search" aria-label="Clear search">
                <i data-lucide="x"></i>
              </button>
            </div>
          </div>

          <div class="field">
            <label for="categoryFilter">Category</label>
            <select id="categoryFilter"></select>
          </div>

          <div class="field">
            <label for="sortFilter">Sort</label>
            <select id="sortFilter">
              <option value="featured">Featured</option>
              <option value="priceLow">Price low to high</option>
              <option value="priceHigh">Price high to low</option>
              <option value="stock">Stock available</option>
            </select>
          </div>
        </section>

        <section class="view-root" id="viewRoot" aria-live="polite"></section>
      </main>
    </div>

    <!-- The drawer is modal (it has a scrim), so it is announced as a
         dialog: screen readers constrain their virtual cursor to it and the
         overlay-a11y layer makes the background inert while it is open. -->
    <aside class="cart-drawer hidden" id="cartDrawer" role="dialog" aria-modal="true" aria-label="Shopping cart">
      <div class="drawer-panel">
        <div class="drawer-header">
          <div>
            <p class="eyebrow">Cart</p>
            <h2>Selected Items</h2>
          </div>
          <button class="icon-button" type="button" data-action="close-cart" aria-label="Close cart">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="cart-lines" id="cartLines"></div>
        <div class="cart-summary">
          <span>Total</span>
          <strong id="cartTotal">PHP 0</strong>
        </div>
        <button class="primary-button wide" type="button" data-action="open-checkout">Checkout</button>
      </div>
    </aside>

    <div class="modal-layer hidden" id="authModal">
      <div class="modal-panel auth-panel" role="dialog" aria-modal="true" aria-labelledby="authTitle">
        <div class="modal-header">
          <div>
            <p class="eyebrow" id="authEyebrow">Account</p>
            <h2 id="authTitle">Login</h2>
          </div>
          <button class="icon-button" type="button" data-action="close-modal" aria-label="Close account form">
            <i data-lucide="x"></i>
          </button>
        </div>

        <div class="segmented-control" role="tablist" aria-label="Account mode">
          <button class="is-active" type="button" data-action="switch-auth" data-mode="login">Login</button>
          <button type="button" data-action="switch-auth" data-mode="register">Register</button>
        </div>

        <form class="form-grid" id="authForm"></form>
      </div>
    </div>

    <div class="modal-layer hidden" id="checkoutModal">
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="checkoutTitle">
        <div class="modal-header">
          <div>
            <p class="eyebrow">Payment</p>
            <h2 id="checkoutTitle">Checkout</h2>
          </div>
          <button class="icon-button" type="button" data-action="close-checkout" aria-label="Close checkout">
            <i data-lucide="x"></i>
          </button>
        </div>
        <form class="form-grid" id="checkoutForm">
          <div class="field">
            <label for="checkoutName">Name</label>
            <input id="checkoutName" name="name" maxlength="80" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="checkoutAddress">Delivery Address</label>
            <textarea id="checkoutAddress" name="address" rows="3" maxlength="300" autocomplete="street-address" required></textarea>
          </div>
          <div class="field split-field">
            <span>
              <label for="paymentMethod">Method</label>
              <select id="paymentMethod" name="method" required>
                <option value="Card">Card</option>
                <option value="GCash">GCash</option>
                <option value="Cash on Delivery">Cash on Delivery</option>
              </select>
            </span>
            <span>
              <label for="paymentReference">Reference</label>
              <input id="paymentReference" name="reference" placeholder="Last 4 or ref no." maxlength="40" autocomplete="off" required />
            </span>
          </div>
          <p class="checkout-summary-line">
            <span>Total due</span>
            <strong id="checkoutTotal">PHP 0</strong>
          </p>
          <button class="primary-button wide" type="submit">Pay and Place Order</button>
        </form>
      </div>
    </div>

    <div class="modal-layer hidden" id="orderDetailModal"></div>
    <div class="modal-layer hidden" id="entityModal"></div>
    <div class="modal-layer hidden" id="quickViewModal"></div>
    <div class="modal-layer hidden" id="dataToolsModal"></div>
    <!-- Practice Mode only (?lab=1): filled in by js/modules/lab-panel.js. -->
    <div class="modal-layer hidden" id="labConsole"></div>
    <div class="modal-layer lightbox-layer hidden" id="lightboxModal"></div>
    <!-- Toasts announce on insertion (each toast is a new child, so
         aria-atomic stays false: only the new message is read, never the
         whole stack). -->
    <div class="toast-area" id="toastArea" aria-live="polite" aria-atomic="false"></div>
    <!-- Screen-reader channel for cart mutations: the topbar badge and the
         drawer's stepper values change silently for assistive tech, so
         cart.js mirrors every count / line-quantity / total change into this
         polite region. Visually hidden, never focused. -->
    <p class="visually-hidden" id="cartAnnouncer" aria-live="polite" aria-atomic="true"></p>
  </body>
</html>

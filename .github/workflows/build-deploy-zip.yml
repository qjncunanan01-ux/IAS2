name: Build deploy zip

# Rebuilds ias2-deploy.zip (ready to upload to InfinityFree htdocs) on every
# push to main. The zip is attached to the run as an artifact and replaces the
# asset on the rolling "latest" release, so
# https://github.com/<owner>/IAS2/releases/latest always has the newest build.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check all JavaScript modules
        run: |
          fail=0
          while IFS= read -r -d '' file; do
            node --check "$file" || fail=1
          done < <(find js -name '*.js' -print0)
          exit $fail

      - name: Run unit tests
        run: npm test

      - name: Verify asset fingerprints are current
        run: node tools/fingerprint.mjs --check

      - name: Verify required files exist
        run: |
          for f in index.html styles.css js/main.js assets/placeholder.svg assets/vendor/lucide.min.js 404.html .htaccess; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
          done

      - name: Build InfinityFree deploy zip
        run: |
          mkdir -p dist
          cp index.html styles.css README.md 404.html .htaccess dist/
          cp -r js assets dist/
          cd dist
          zip -qr ../ias2-deploy.zip index.html styles.css 404.html .htaccess js assets README.md
          cd ..
          rm -rf dist
          echo "Zip contents:"
          unzip -l ias2-deploy.zip

      - name: Upload artifact (kept 90 days)
        uses: actions/upload-artifact@v4
        with:
          name: ias2-deploy
          path: ias2-deploy.zip
          retention-days: 90

      - name: Refresh rolling "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest deploy build
          files: ias2-deploy.zip
          body: |
            Auto-built from the latest push to `main`.
            Download `ias2-deploy.zip`, upload it to your InfinityFree
            `htdocs` folder, and extract in place.
          make_latest: true

  # Auto-deploy to InfinityFree. Required settings (Settings > Secrets and
  # variables > Actions):
  #   Secrets:   FTP_HOST (ftpupload.net), FTP_USERNAME (epiz_...),
  #              FTP_PASSWORD (from the FTP Details tab)
  # The job always runs and fails with a precise message if a secret is
  # missing, so a misconfigured deploy is visible instead of silently skipped.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets are present
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          [ -z "$FTP_HOST" ] && { echo "::error::Secret FTP_HOST is missing (Settings > Secrets and variables > Actions > Secrets)"; missing=1; }
          [ -z "$FTP_USERNAME" ] && { echo "::error::Secret FTP_USERNAME is missing (should look like epiz_12345678)"; missing=1; }
          [ -z "$FTP_PASSWORD" ] && { echo "::error::Secret FTP_PASSWORD is missing (reset it in the InfinityFree FTP Details tab)"; missing=1; }
          exit $missing

      - name: Download built zip
        uses: actions/download-artifact@v4
        with:
          name: ias2-deploy

      - name: Unpack for upload
        run: |
          mkdir site
          cd site
          unzip -q ../ias2-deploy.zip

      - name: Upload to InfinityFree over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          server-dir: /htdocs/
          local-dir: site/
